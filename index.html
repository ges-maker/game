<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c3ea9e">
<title>포근 숲속 농장</title>
<style>
:root{--cream:#fff9ef;--line:#f0e2c6;--ink:#6a5444;--ink2:#9a8270;--pink:#f8b4c2;--pinkD:#ec8fa3;--mint:#a6e3cb;--mintD:#6fc7a5;--yellow:#ffe390;--shadow:0 6px 18px rgba(120,90,60,.16);--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#98cf84;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* HUD */
#hud{position:fixed;top:calc(10px + var(--safeT));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:rgba(255,249,239,.93);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:700}
.wicon{width:38px;height:38px;border-radius:14px;background:#e9f7ff;display:flex;align-items:center;justify-content:center;font-size:22px}
.dcol{display:flex;flex-direction:column;line-height:1.15}
.dcol b{font-size:15px}.dcol span{font-size:13px;color:var(--ink2)}
.hud-right{display:flex;gap:6px;align-items:center;pointer-events:auto}
.coin{padding:6px 14px;font-size:16px;gap:6px;height:44px}
.coin i{font-style:normal;font-size:18px}
.rbtn{width:44px;height:44px;border-radius:16px;background:rgba(255,249,239,.93);border:2px solid var(--line);box-shadow:var(--shadow);font-size:20px;display:flex;align-items:center;justify-content:center}
.rbtn:active,.tool:active,.big:active{transform:scale(.94)}

/* toolbar */
#toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safeB));display:flex;gap:8px;padding:8px;background:rgba(255,249,239,.95);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);z-index:6}
.tool{width:66px;height:70px;border-radius:19px;background:#fff;border:2px solid #f3e8d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;position:relative;transition:transform .12s,background .12s;padding:0 0 6px}
.tool svg{width:36px;height:36px}
.tool span{white-space:nowrap;font-size:11.5px}
.tool.active{background:#fff2cc;border-color:#f3c766;transform:translateY(-5px);box-shadow:0 6px 12px rgba(230,180,80,.25)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--pinkD);color:#fff;font-size:11px;font-style:normal;border-radius:10px;padding:1px 6px;border:2px solid #fff;min-width:22px;text-align:center}
.badge.blue{background:#6dbde3}
.mini{position:absolute;top:4px;left:6px;font-size:15px}
.wbar{position:absolute;left:9px;right:9px;bottom:5px;height:5px;border-radius:3px;background:#e4eef3;overflow:hidden}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#9fdcf5,#5bb8e6);border-radius:3px;transition:width .3s}

/* seed picker */
#seedPicker{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--safeB));background:rgba(255,249,239,.97);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px;z-index:7}
.sp{width:72px;padding:8px 2px;border-radius:16px;background:#fff;border:2px solid #f3e8d4;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700}
.sp .e{font-size:24px}.sp small{color:var(--ink2);font-weight:600}
.sp.on{background:#fff2cc;border-color:#f3c766}

/* action & joystick */
#actBtn{position:fixed;right:18px;bottom:calc(108px + var(--safeB));width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#ffe0e6 45%,#f8b4c2 100%);border:3px solid #fff;box-shadow:0 6px 16px rgba(220,120,140,.35);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#a2566a}
#actBtn .ai{font-size:26px;line-height:1.1}
#actBtn kbd{position:absolute;top:-6px;left:-6px;background:#fff;border:2px solid var(--line);border-radius:8px;font:700 11px inherit;padding:1px 6px;color:var(--ink2)}
body.touch #actBtn kbd{display:none}
#joy{position:fixed;left:22px;bottom:calc(28px + var(--safeB));width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.18));border:3px solid rgba(255,255,255,.75);box-shadow:0 6px 18px rgba(80,110,60,.18);z-index:6;display:none;touch-action:none}
body.touch #joy{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fff6e6 60%,#f3e2c4);border:2px solid #fff;box-shadow:0 4px 10px rgba(120,90,60,.25);pointer-events:none}
@media (max-width:720px){
  body.touch #joy{bottom:calc(104px + var(--safeB));left:14px;width:124px;height:124px}
  body.touch #actBtn{bottom:calc(112px + var(--safeB));right:14px}
}
@media (max-width:420px){
  .tool{width:58px;height:64px}.tool svg{width:32px;height:32px}.tool span{font-size:10.5px}
  #toolbar{gap:6px;padding:6px}
  .rbtn{width:38px;height:38px;font-size:17px;border-radius:14px}
  .coin{height:38px;padding:4px 10px;font-size:14px}
  .wicon{width:32px;height:32px;font-size:18px}
  .dcol b{font-size:13.5px}.dcol span{font-size:12px}
  .pill{padding:4px 10px 4px 5px}
  #seedPicker{bottom:calc(94px + var(--safeB))}.sp{width:64px}
}

/* toast */
#toast{position:fixed;left:50%;top:calc(74px + var(--safeT));transform:translate(-50%,-10px);background:rgba(255,250,242,.97);border:2px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* modal */
#modalBg{position:fixed;inset:0;background:rgba(95,75,55,.28);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(430px,100%);max-height:84vh;overflow:auto;background:var(--cream);border:2px solid var(--line);border-radius:28px;box-shadow:0 14px 40px rgba(100,70,40,.25);padding:18px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mt{font-size:19px;font-weight:800}
.x{width:36px;height:36px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:15px;font-weight:800;color:var(--ink2)}
.coins-line{background:#fff;border-radius:16px;padding:9px 14px;display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;border:2px solid #f6ecda}
.tabs{display:flex;gap:6px;background:#f6ead6;padding:4px;border-radius:16px;margin-bottom:10px}
.tab{flex:1;padding:10px;border-radius:12px;background:transparent;font-weight:800;font-size:14px;color:var(--ink2)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(120,90,60,.12)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px;margin-bottom:8px;border:2px solid #f6ecda}
.ri{width:46px;height:46px;border-radius:14px;background:#fff6e4;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.rt{flex:1;display:flex;flex-direction:column;min-width:0}
.rt b{font-size:15px}.rt small{color:var(--ink2);font-size:12px;margin-top:2px}
.rb{display:flex;gap:5px;flex:none}
.btn{padding:9px 12px;border-radius:13px;background:linear-gradient(#bff0dc,#9fdfc6);font-weight:800;font-size:13px;color:#3f7d66;box-shadow:0 3px 0 #86c9ae}
.btn.pink{background:linear-gradient(#ffd0da,#f8b4c2);color:#9d4d61;box-shadow:0 3px 0 #e597a8}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cell{background:#fff;border-radius:16px;border:2px solid #f6ecda;padding:8px 2px;text-align:center;font-size:12px;font-weight:700}
.cell .e{font-size:26px;display:block}.cell em{font-style:normal;color:var(--pinkD);font-size:14px}
.sec{font-weight:800;font-size:14px;margin:6px 2px 8px;color:var(--ink2)}
.mbtns{display:flex;flex-direction:column;gap:8px}
.mbtns .btn{padding:13px;font-size:15px}
.help p{margin:6px 0;font-size:14px;line-height:1.55}
.help .steps{background:#fff;border-radius:16px;padding:10px 14px;border:2px solid #f6ecda;margin:8px 0}
.note{font-size:12px;color:var(--ink2);text-align:center;margin-top:10px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* day fade */
#dayFade{position:fixed;inset:0;background:linear-gradient(#5d6aa8,#9a86c2);display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;pointer-events:none;transition:opacity .55s;color:#fff;text-align:center}
#dayFade.show{opacity:1;pointer-events:auto}
#dayFade h2{margin:6px 0 0;font-size:34px}
#dayFade small{font-size:15px;opacity:.9}

/* character select */
#select{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(#cdeefe 0%,#eaf8ff 52%,#d3f1b3 52.2%,#bfe89a 100%);overflow:auto;padding:20px;touch-action:pan-y}
.cloud{position:absolute;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;left:18px;top:-26px}.cloud::after{width:42px;height:42px;left:60px;top:-18px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sel-box{position:relative;background:rgba(255,250,240,.94);border:2px solid var(--line);border-radius:34px;padding:26px 20px 24px;box-shadow:0 14px 40px rgba(110,140,90,.22);text-align:center;width:min(540px,100%)}
.sel-box h1{margin:0;font-size:clamp(26px,7vw,36px);color:#e88fa2;letter-spacing:-.5px}
.sel-box>p{margin:6px 0 0;color:var(--ink2);font-weight:600}
.cards{display:flex;gap:12px;justify-content:center;margin:18px 0 20px}
.ccard{flex:1;max-width:210px;background:#fff;border:3px solid #f1e6d2;border-radius:26px;padding:10px 8px 14px;display:flex;flex-direction:column;align-items:center;transition:.15s}
.ccard canvas{width:100%;max-width:160px;aspect-ratio:150/170}
.ccard b{font-size:18px;margin-top:2px}.ccard span{font-size:12.5px;color:var(--ink2);font-weight:600}
.ccard.on{border-color:#f5a3b5;background:#fff4f6;transform:translateY(-4px);box-shadow:0 8px 20px rgba(240,140,160,.25)}
.big{background:linear-gradient(#ffc6d1,#f7a2b4);color:#fff;font-size:18px;font-weight:800;padding:15px 34px;border-radius:999px;box-shadow:0 5px 0 #e48a9d,0 10px 22px rgba(230,130,150,.3);text-shadow:0 1px 0 rgba(200,90,110,.4)}
.big:disabled{filter:grayscale(.7);opacity:.55;cursor:default}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="pill"><div class="wicon" id="wIcon">☀️</div><div class="dcol"><b id="dateTxt">봄 1일</b><span id="timeTxt">오전 6:00</span></div></div>
  <div class="hud-right">
    <div class="pill coin"><i>🪙</i><b id="coinTxt">100</b></div>
    <button class="rbtn" id="sleepBtn" title="다음 날로">🌙</button>
    <button class="rbtn" id="bagBtn" title="인벤토리 (B)">🎒</button>
    <button class="rbtn" id="menuBtn" title="메뉴">⚙️</button>
  </div>
</div>

<div id="toolbar" class="hidden">
  <button class="tool" data-tool="hoe">
    <svg viewBox="0 0 40 40"><path d="M9 34 L27 9" stroke="#c99a6e" stroke-width="4.5" stroke-linecap="round"/><rect x="20" y="4" width="15" height="7" rx="3.5" fill="#c4d2dc" stroke="#8ea0ae" stroke-width="1.5" transform="rotate(32 27 8)"/></svg>
    <span>괭이</span></button>
  <button class="tool" data-tool="seed">
    <svg viewBox="0 0 40 40"><path d="M12 13 q-5 10 -3 17 q2 5 11 5 q9 0 11-5 q2-7 -3-17z" fill="#f3d7a8" stroke="#cfa874" stroke-width="1.6"/><rect x="12" y="9" width="16" height="6" rx="3" fill="#f8b4c2" stroke="#e597a8" stroke-width="1.2"/><circle cx="17" cy="25" r="1.7" fill="#a8774a"/><circle cx="22.5" cy="29" r="1.7" fill="#a8774a"/><circle cx="23.5" cy="22" r="1.7" fill="#a8774a"/></svg>
    <span id="seedLbl">당근</span><i class="mini" id="seedMini">🥕</i><em class="badge" id="seedBadge">5</em></button>
  <button class="tool" data-tool="water">
    <svg viewBox="0 0 40 40"><path d="M7 16 h19 a2 2 0 0 1 2 2 v11 a4 4 0 0 1 -4 4 h-13 a4 4 0 0 1 -4 -4z" fill="#a8dcf2" stroke="#6fb3d4" stroke-width="1.6"/><path d="M28 21 l7 -7" stroke="#6fb3d4" stroke-width="3.2" stroke-linecap="round"/><circle cx="35.3" cy="13.6" r="2.7" fill="#a8dcf2" stroke="#6fb3d4" stroke-width="1.4"/><path d="M10 16 q7 -10 14 0" fill="none" stroke="#6fb3d4" stroke-width="2.4"/><ellipse cx="13" cy="23" rx="2" ry="3" fill="#fff" opacity=".7"/></svg>
    <span>물뿌리개</span><div class="wbar"><i id="waterFill"></i></div><em class="badge blue" id="waterBadge">12</em></button>
  <button class="tool" data-tool="harvest">
    <svg viewBox="0 0 40 40"><path d="M11 19 q9 -16 18 0" fill="none" stroke="#c99a6e" stroke-width="3"/><circle cx="15" cy="17" r="4.2" fill="#ff8a7a"/><circle cx="23.5" cy="16" r="3.8" fill="#ffb35c"/><path d="M6 19 h28 l-3 13 a3 3 0 0 1 -3 2.5 h-16 a3 3 0 0 1 -3 -2.5z" fill="#f2cc96" stroke="#c99a6e" stroke-width="1.6"/><path d="M8.5 24 h23 M10 29 h20" stroke="#d9ab75" stroke-width="1.6"/></svg>
    <span>수확</span></button>
</div>

<div id="seedPicker" class="hidden"></div>
<button id="actBtn" class="hidden"><kbd>E</kbd><span class="ai" id="actIcon">⛏️</span><span id="actLbl">사용</span></button>
<div id="joy" class="hidden"><div id="joyKnob"></div></div>
<div id="toast"></div>
<div id="modalBg" class="hidden"><div class="modal" id="modal"></div></div>
<div id="dayFade"><div><small id="dfSub"></small><h2 id="dfTitle"></h2></div></div>

<div id="select">
  <div class="cloud" style="top:8%;animation-delay:-8s"></div>
  <div class="cloud" style="top:20%;animation-delay:-26s;transform:scale(.7)"></div>
  <div class="cloud" style="top:32%;animation-delay:-17s"></div>
  <div class="sel-box">
    <h1>포근 숲속 농장</h1>
    <p>숲속 정원에서 함께할 친구를 골라주세요</p>
    <div class="cards">
      <button class="ccard" data-kind="boy"><canvas width="300" height="340"></canvas><b>하루</b><span>남자 캐릭터</span></button>
      <button class="ccard" data-kind="girl"><canvas width="300" height="340"></canvas><b>소이</b><span>여자 캐릭터</span></button>
    </div>
    <button id="startBtn" class="big" disabled>농장으로 출발하기</button>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================= 기본 설정 ================= */
const T=48, W=32, H=24, WW=W*T, WH=H*T, TAU=Math.PI*2;
const SAVE_KEY='cozyForestFarm_v1';
const CROPS={
  carrot:{name:'당근',emoji:'🥕',days:3,seed:15,sell:35},
  strawberry:{name:'딸기',emoji:'🍓',days:4,seed:25,sell:55},
  tomato:{name:'토마토',emoji:'🍅',days:5,seed:30,sell:72},
  sunflower:{name:'해바라기',emoji:'🌻',days:6,seed:40,sell:110}
};
const CK=Object.keys(CROPS);
const WATER_MAX=12, SPEED=170, MIN_PER_SEC=2, DAY_START=360, DAY_END=1440, REACH=1.75*T;
const WEATHER={sunny:{icon:'☀️',name:'맑음'},cloudy:{icon:'⛅',name:'흐림'},rain:{icon:'🌧️',name:'비'}};
const SEASONS=['봄','여름','가을','겨울'];
const TOOLS={hoe:{name:'괭이질',icon:'⛏️'},seed:{name:'씨앗 심기',icon:'🌱'},water:{name:'물 주기',icon:'💧'},harvest:{name:'수확',icon:'🧺'}};

// 고정 배치 (월드 좌표)
const HOUSE={x:618,y:58,w:300,h:240,base:282};
const HOUSE_COL={x:622,y:40,w:292,h:244};
const DOOR={x:768,y:292};
const POND={cx:1080,cy:206,rx:132,ry:78};
const VEND={x:511,y:160,w:80,h:118,base:272};
const VEND_COL={x:518,y:205,w:66,h:70};
const PATH={x:744,y:276,w:48,h:110};
const SPAWN={x:768,y:340};
const BOUNDS={x0:3*T-6,x1:(W-3)*T+6,y0:2*T+22,y1:(H-3)*T+4};

const CHAR={
  boy:{hair:'#7b5240',hairHi:'#a2735a',shirt:'#a9dcc6',shirtD:'#8ccab0',pants:'#e9d3b0',shoes:'#9c7458',accent:'#f7c96b'},
  girl:{hair:'#a86b4d',hairHi:'#cc8f6e',shirt:'#f8c3cd',shirtD:'#eeaab8',pants:'#ffe4d2',shoes:'#9c7458',accent:'#ffe07a'}
};
const SKIN='#ffe4d2', OUT='#9b7363', EYE='#4b3732';

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function el(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU)}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU)}
function mk(w,h,s=2){const cv=document.createElement('canvas');cv.width=Math.ceil(w*s);cv.height=Math.ceil(h*s);const c=cv.getContext('2d');c.scale(s,s);return{cv,c}}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function circleRect(x,y,rad,r){const nx=clamp(x,r.x,r.x+r.w),ny=clamp(y,r.y,r.y+r.h);return (x-nx)**2+(y-ny)**2<rad*rad}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function star(c,x,y,r){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rad=i%2?r*.38:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath()}

/* ================= 상태 & 저장 ================= */
function defaultState(){return{v:1,character:null,coins:100,seeds:{carrot:5,strawberry:2,tomato:0,sunflower:0},crops:{carrot:0,strawberry:0,tomato:0,sunflower:0},water:WATER_MAX,day:1,time:DAY_START,weather:'sunny',plots:{},player:{x:SPAWN.x,y:SPAWN.y,dir:'down'},tool:'hoe',seed:'carrot',sound:true,helpSeen:false}}
let S=defaultState();
function load(){

  c.beginPath();if(up)c.arc(hx,hy,16,0,TAU);else c.arc(hx,hy,16,-.04*Math.PI,1.04*Math.PI);c.stroke();
  // 얼굴
  if(!up){
    const ey=hy+2,blink=(t%3.7)<.13;
    const fx=hx+side*4.5;
    const eyes=side?[[fx-4.2,side<0?1:.82],[fx+4.2,side>0?1:.82]]:[[hx-5.8,1],[hx+5.8,1]];
    for(const[ex,sc]of eyes){
      if(blink){c.strokeStyle=EYE;c.lineWidth=1.5;c.beginPath();c.moveTo(ex-2.3*sc,ey+.5);c.quadraticCurveTo(ex,ey+1.8,ex+2.3*sc,ey+.5);c.stroke()}
      else{c.fillStyle=EYE;el(c,ex,ey,2.3*sc,3.1);c.fill();c.fillStyle='#fff';circ(c,ex+.8,ey-1.1,.95);c.fill()}
    }
    c.fillStyle='rgba(255,160,178,.55)';
    if(side){el(c,fx+side*6,ey+4.5,2.8,1.8);c.fill()}else{el(c,hx-9.6,ey+4.5,3.2,1.9);c.fill();el(c,hx+9.6,ey+4.5,3.2,1.9);c.fill()}
    c.strokeStyle='#b06a5e';c.lineWidth=1.3;c.beginPath();const mx=side?fx+side*2:hx;c.arc(mx,ey+4.4,2.1,.2*Math.PI,.8*Math.PI);c.stroke();
    c.strokeStyle=OUT;c.lineWidth=1.6;
  }
  // 옆머리 / 장식
  c.fillStyle=P.hair;
  if(kind==='girl'){
    if(up){rr(c,-16,hy-2,32,27,11);c.fill();c.stroke()}
    else if(side){rr(c,hx-side*13-3.5,hy-4,7,24,3.5);c.fill();c.stroke()}
    else{for(const sd of[-1,1]){c.beginPath();c.moveTo(hx+sd*15.5,hy-6);c.quadraticCurveTo(hx+sd*19.5,hy+8,hx+sd*17,hy+19);c.quadraticCurveTo(hx+sd*13.5,hy+21,hx+sd*12.5,hy+15);c.quadraticCurveTo(hx+sd*14.5,hy+5,hx+sd*12,hy-4);c.closePath();c.fill();c.stroke()}}
    const fx2=up?hx+9:side?hx-side*7:hx+11,fy2=hy-11;
    c.fillStyle='#ffc6d3';for(let k=0;k<5;k++){const a=k/5*TAU;circ(c,fx2+Math.cos(a)*2.8,fy2+Math.sin(a)*2.8,2.5);c.fill()}
    c.fillStyle='#ffe07a';circ(c,fx2,fy2,1.6);c.fill();
  }else{
    if(!up&&!side){el(c,hx-14.5,hy+1,3,6);c.fill();el(c,hx+14.5,hy+1,3,6);c.fill()}
    c.lineWidth=4;c.strokeStyle=OUT;c.beginPath();c.moveTo(hx+1,hy-18);c.quadraticCurveTo(hx+6,hy-26,hx+10,hy-22);c.stroke();
    c.lineWidth=2.2;c.strokeStyle=P.hair;c.stroke();c.strokeStyle=OUT;c.lineWidth=1.6;
  }
  c.restore();c.restore();
}

function leaf(c,x,y,rx,ry,rot,col){c.fillStyle=col;el(c,x,y,rx,ry,rot);c.fill()}
function drawCrop(c,type,st,cx,cy,t,seedv){
  const by=cy+8, sway=Math.sin(t*1.8+seedv)*.05;
  c.save();c.translate(cx,by);
  if(st===0){c.fillStyle='#8d6447';el(c,0,-2,9,4.5);c.fill();c.fillStyle='#f3e1b5';for(const[x,y]of[[-3,-3],[2,-2],[4,-4]]){el(c,x,y,1.3,1);c.fill()}c.restore();return}
  c.rotate(sway);
  const G1='#86cf6a',G2='#a5e08a',G3='#6dba59';
  if(st===1){c.strokeStyle=G3;c.lineWidth=2.4;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(0,-10);c.stroke();leaf(c,-5,-11,5.5,3,-.5,G2);leaf(c,5,-12,5.5,3,.5,G1);c.restore();return}
  if(type==='carrot'){
    const n=st===3?5:4,h=st===3?22:17;
    for(let i=0;i<n;i++){const a=(i/(n-1)-.5)*1.3;c.save();c.rotate(a);leaf(c,0,-h/2,3,h/2,0,i%2?G1:G2);c.restore()}
    if(st===3){c.fillStyle='#ffa45c';c.beginPath();c.moveTo(-7,-1);c.quadraticCurveTo(0,-9,7,-1);c.quadraticCurveTo(0,6,-7,-1);c.fill();c.strokeStyle='rgba(200,110,50,.5)';c.lineWidth=1;c.beginPath();c.moveTo(-3,-1);c.lineTo(3,-1);c.stroke()}
  }else if(type==='tomato'){
    const hgt=st===3?30:22;
    c.strokeStyle=G3;c.lineWidth=2.6;c.beginPath();c.moveTo(0,0);c.lineTo(0,-hgt+6);c.stroke();
    c.strokeStyle='#c9a37a';c.lineWidth=1.5;c.beginPath();c.moveTo(9,0);c.lineTo(9,-hgt);c.stroke();
    for(const[x,y,r]of[[-6,-hgt*.35,7],[6,-hgt*.55,7],[-3,-hgt*.8,7],[4,-hgt*.95,5.5]]){leaf(c,x,y,r,r*.8,0,G1);leaf(c,x-1.5,y-1.5,r*.55,r*.45,0,G2)}
    const fr=st===3?[[-6,-hgt*.3],[6,-hgt*.5],[-1,-hgt*.72]]:[[-5,-hgt*.35],[5,-hgt*.6]];
    for(const[x,y]of fr){c.fillStyle=st===3?'#ff7b6b':'#bfe27e';circ(c,x,y,st===3?4.8:3.2);c.fill();c.fillStyle='rgba(255,255,255,.6)';circ(c,x-1.4,y-1.4,1.2);c.fill();c.fillStyle=G3;star(c,x,y-(st===3?4:3),1.8);c.fill()}
  }else if(type==='strawberry'){
    for(let i=0;i<6;i++){const a=i/6*TAU;leaf(c,Math.cos(a)*6,-5+Math.sin(a)*3,6,4,a,i%2?G1:G2)}
    leaf(c,0,-9,5,4,0,G1);
    if(st===2){for(const[x,y]of[[-5,-10],[5,-8]]){c.fillStyle='#fff';for(let k=0;k<5;k++){const a=k/5*TAU;circ(c,x+Math.cos(a)*2,y+Math.sin(a)*2,1.7);c.fill()}c.fillStyle='#ffd25c';circ(c,x,y,1.1);c.fill()}}
    else{for(const[x,y]of[[-7,-2],[6,-1],[0,-6]]){c.fillStyle='#ff6f82';c.beginPath();c.moveTo(x-4,y-2);c.quadraticCurveTo(x,y-5,x+4,y-2);c.quadraticCurveTo(x+3,y+4,x,y+6);c.quadraticCurveTo(x-3,y+4,x-4,y-2);c.fill();c.fillStyle='#ffeab0';for(const[a,b]of[[-1.5,0],[1.5,1],[0,3]]){circ(c,x+a,y+b,.6);c.fill()}c.fillStyle=G3;star(c,x,y-3,2.4);c.fill()}}
  }else if(type==='sunflower'){
    const hgt=st===3?42:28;
    c.strokeStyle=G3;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(2,-hgt/2,0,-hgt);c.stroke();
    leaf(c,-6,-hgt*.35,7,3.6,-.4,G1);leaf(c,6,-hgt*.55,7,3.6,.4,G2);
    if(st===2){c.fillStyle='#8dcf6e';circ(c,0,-hgt-2,5.5);c.fill();c.fillStyle='#ffe08a';circ(c,0,-hgt-5,2);c.fill()}
    else{const fy=-hgt-4;c.fillStyle='#ffd65a';for(let k=0;k<12;k++){const a=k/12*TAU;el(c,Math.cos(a)*8,fy+Math.sin(a)*8,4.8,2.6,a);c.fill()}c.fillStyle='#ffe692';for(let k=0;k<12;k++){const a=(k+.5)/12*TAU;el(c,Math.cos(a)*6,fy+Math.sin(a)*6,3.2,1.8,a);c.fill()}c.fillStyle='#a86f45';circ(c,0,fy,5.6);c.fill();c.fillStyle='#8a5634';for(const[a,b]of[[-2,-1],[1.5,-2],[0,1.5],[2.5,1],[-2,2]]){circ(c,a,fy+b,.8);c.fill()}}
  }
  c.restore();
}

function blocked(x,y){
  const r=12;
  if(x<BOUNDS.x0||x>BOUNDS.x1||y<BOUNDS.y0||y>BOUNDS.y1)return true;
  if(circleRect(x,y,r,HOUSE_COL)||circleRect(x,y,r,VEND_COL))return true;
  const ex=(x-POND.cx)/(POND.rx+10+r*.5),ey=(y-POND.cy)/(POND.ry+8+r*.5);if(ex*ex+ey*ey<1)return true;
  for(const tr of trees){const dx=x-tr.x,dy=y-(tr.y-4);if(dx*dx+dy*dy<(r+12*tr.s)**2)return true}
  return false;
}
function tillable(tx,ty){
  if(tx<3||tx>W-4||ty<3||ty>H-4)return false;
  const R={x:tx*T,y:ty*T,w:T,h:T};
  const inf=(r,m)=>({x:r.x-m,y:r.y-m,w:r.w+m*2,h:r.h+m*2});
  if(overlap(R,inf(HOUSE_COL,2))||overlap(R,inf(VEND_COL,2))||overlap(R,PATH))return false;
  if(overlap(R,{x:POND.cx-POND.rx-16,y:POND.cy-POND.ry-12,w:(POND.rx+16)*2,h:(POND.ry+14)*2}))return false;
  if(overlap(R,{x:690,y:282,w:156,h:36}))return false;
  return true;
}

/* ================= 상호작용 ================= */
function nearPond(){const ex=(player.x-POND.cx)/(POND.rx+46),ey=(player.y-POND.cy)/(POND.ry+46);return ex*ex+ey*ey<=1}
function nearVend(){return Math.hypot(player.x-(VEND.x+40),player.y-(VEND.base+14))<78}
function nearDoor(){return Math.hypot(player.x-DOOR.x,player.y-DOOR.y)<64}
function currentInteract(){if(nearVend())return'vend';if(nearDoor())return'house';if(nearPond())return'pond';return null}
function interact(kind){
  if(kind==='pond'){
    if(S.water>=WATER_MAX){toast('물뿌리개가 이미 가득 찼어요 💧');return}
    S.water=WATER_MAX;sfx('fill');toast('연못에서 물뿌리개를 가득 채웠어요 💧');
    const a=Math.atan2((player.y-POND.cy)/POND.ry,(player.x-POND.cx)/POND.rx);burst(POND.cx+Math.cos(a)*(POND.rx-14),POND.cy+Math.sin(a)*(POND.ry-10),'drop',14);
    updateHUD();saveSoon();
  }else if(kind==='vend'){sfx('ui');openShop('buy')}
  else if(kind==='house'){confirmSleep()}
}
function goInteract(kind){
  if((kind==='pond'&&nearPond())||(kind==='vend'&&nearVend())||(kind==='house'&&nearDoor())){interact(kind);return}
  let tx,ty,done;
  if(kind==='pond'){const a=Math.atan2((player.y-POND.cy)/POND.ry,(player.x-POND.cx)/POND.rx);tx=POND.cx+Math.cos(a)*(POND.rx+30);ty=POND.cy+Math.sin(a)*(POND.ry+30);done=nearPond}
  else if(kind==='vend'){tx=VEND.x+40;ty=VEND.base+30;done=nearVend}
  else{tx=DOOR.x;ty=DOOR.y+24;done=nearDoor}
  player.target={x:tx,y:ty,done,act:()=>interact(kind),stuck:0,lastD:1e9};
}
function facingTile(){const o={down:[0,.75],up:[0,-1.05],left:[-.85,-.3],right:[.85,-.3]}[player.dir];return{tx:Math.floor((player.x+o[0]*T)/T),ty:Math.floor((player.y+o[1]*T)/T)}}
function doAction(){
  if(!running||modalOpen||fading)return;
  const it=currentInteract();if(it){interact(it);return}
  const f=facingTile();useTool(f.tx,f.ty);
}
$('#actBtn').addEventListener('click',()=>{unlockAudio();doAction()});
function handleTap(wx,wy){
  if(wx>=VEND.x+4&&wx<=VEND.x+76&&wy>=VEND.y&&wy<=VEND.base+4){goInteract('vend');return}
  const ex=(wx-POND.cx)/(POND.rx+10),ey=(wy-POND.cy)/(POND.ry+10);if(ex*ex+ey*ey<=1){goInteract('pond');return}
  if(wx>=HOUSE.x+10&&wx<=HOUSE.x+HOUSE.w-10&&wy>=HOUSE.y+10&&wy<=HOUSE.base){goInteract('house');return}
  const tx=Math.floor(wx/T),ty=Math.floor(wy/T),key=tx+','+ty;
  if(!S.plots[key]&&!tillable(tx,ty)){toast('여기에는 밭을 만들 수 없어요',true);return}
  const cx=tx*T+T/2,cy=ty*T+T/2;
  if(Math.hypot(player.x-cx,player.y-cy)<=REACH){useTool(tx,ty);return}
  player.target={x:cx,y:cy+T*.55,done:()=>Math.hypot(player.x-cx,player.y-cy)<=REACH,act:()=>useTool(tx,ty),stuck:0,lastD:1e9};
}
function faceTo(x,y){const dx=x-player.x,dy=y-player.y;if(Math.abs(dx)>Math.abs(dy))player.dir=dx<0?'left':'right';else player.dir=dy<0?'up':'down'}
function useTool(tx,ty){
  const key=tx+','+ty,p=S.plots[key],cx=tx*T+T/2,cy=ty*T+T/2;
  faceTo(cx,cy+8);
  const fail=m=>{toast(m,true);sfx('error')};
  if(S.tool==='hoe'){
    if(!p){if(!tillable(tx,ty))return fail('여기에는 밭을 만들 수 없어요');S.plots[key]={w:S.weather==='rain',c:null,d:0,v:Math.random()*6};burst(cx,cy,'dirt',10);sfx('till');player.act=.3}
    else if(!p.c){delete S.plots[key];burst(cx,cy,'leaf',8);sfx('till');player.act=.3;toast('밭을 다시 잔디로 되돌렸어요')}
    else return fail('작물이 자라고 있는 밭이에요');
  }else if(S.tool==='seed'){
    const c=CROPS[S.seed];
    if(!p)return fail('먼저 괭이로 밭을 갈아주세요');
    if(p.c)return fail('이미 작물이 심어져 있어요');
    if(S.seeds[S.seed]<=0){fail(`${c.name} 씨앗이 없어요. 자판기에서 살 수 있어요`);return}
    S.seeds[S.seed]--;p.c=S.seed;p.d=0;burst(cx,cy,'leaf',8);sfx('plant');player.act=.3;floatText(cx,cy-10,`${c.emoji} 심기`);
  }else if(S.tool==='water'){
    if(!p)return fail('밭에만 물을 줄 수 있어요');
    if(S.water<=0)return fail('물뿌리개가 비었어요! 연못에서 채워주세요');
    if(isMature(p))return fail('다 자란 작물이에요. 수확해보세요!');
    if(p.w)return fail('이미 촉촉하게 젖어 있어요');
    S.water--;p.w=true;rain(cx,cy);sfx('water');player.act=.3;
    if(S.water===0)setTimeout(()=>toast('물을 다 썼어요. 연못에서 다시 채워요 💧'),400);
  }else if(S.tool==='harvest'){
    if(!p||!p.c)return fail('수확할 작물이 없어요');
    if(!isMature(p))return fail(`아직 자라는 중이에요 (${p.d}/${CROPS[p.c].days}일)`);
    const c=CROPS[p.c];S.crops[p.c]++;floatText(cx,cy-24,`+1 ${c.emoji} ${c.name}`);burst(cx,cy-10,'spark',14);sfx('harvest');player.act=.3;
    p.c=null;p.d=0;p.w=false;
  }
  updateHUD();saveSoon();
}

/* ================= 업데이트 ================= */
let lastAct='';
function update(dt){
  const paused=modalOpen||fading;
  let ix=0,iy=0;
  if(!paused){
    if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
    ix+=joy.x;iy+=joy.y;
  }
  const mag=Math.hypot(ix,iy);
  let vx=0,vy=0;
  if(mag>.2){player.target=null;vx=ix/mag;vy=iy/mag}
  else if(player.target&&!paused){
    const tg=player.target;
    if(tg.done()){player.target=null;tg.act()}
    else{const dx=tg.x-player.x,dy=tg.y-player.y,d=Math.hypot(dx,dy);
      if(d<3){player.target=null;tg.act()}
      else{vx=dx/d;vy=dy/d;if(d>tg.lastD-.4)tg.stuck+=dt;else tg.stuck=0;tg.lastD=d;if(tg.stuck>.45){player.target=null;toast('길이 막혀 있어요. 조금 돌아서 가볼까요?')}}}
  }
  player.moving=false;
  if((vx||vy)&&!paused){
    const ox=player.x,oy=player.y;
    const nx=player.x+vx*SPEED*dt;if(!blocked(nx,player.y))player.x=nx;
    const ny=player.y+vy*SPEED*dt;if(!blocked(player.x,ny))player.y=ny;
    const moved=Math.hypot(player.x-ox,player.y-oy);
    if(Math.abs(vx)>Math.abs(vy)*1.05)player.dir=vx<0?'left':'right';else player.dir=vy<0?'up':'down';
    if(moved>.01){player.moving=true;player.phase+=moved*.075}
  }
  if(player.act>0)player.act=Math.max(0,player.act-dt);
  if(!paused){S.time+=dt*MIN_PER_SEC;if(S.time>=DAY_END){S.time=DAY_END-1;nextDay('late')}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=22*dt;if(f.life<=0)floats.splice(i,1)}
  // 액션 버튼
  const it=currentInteract();
  const a=it==='pond'?['💧','물 채우기']:it==='vend'?['🏪','자판기']:it==='house'?['🛏️','잠자기']:[TOOLS[S.tool].icon,TOOLS[S.tool].name];
  const k=a.join();if(k!==lastAct){lastAct=k;$('#actIcon').textContent=a[0];$('#actLbl').textContent=a[1]}
  updateHUD();
}

/* ================= 렌더 ================= */
const drops=[];for(let i=0;i<90;i++)drops.push({x:Math.random(),y:Math.random(),s:.7+Math.random()*.6});
function tint(m){const h=m/60;
  if(h<7)return[255,205,180,(7-h)*.12];
  if(h<16.5)return null;
  if(h<19)return[255,170,110,.17*(h-16.5)/2.5];
  if(h<20.5){const k=(h-19)/1.5;return[Math.round(255-175*k),Math.round(170-80*k),Math.round(110+60*k),.17+.13*k]}

}
let gt=0;

  if(ht&&!modalOpen){const key=ht.tx+','+ht.ty;if(S.plots[key]||tillable(ht.tx,ht.ty)){const cx=ht.tx*T+T/2,cy=ht.ty*T+T/2,inR=Math.hypot(player.x-cx,player.y-cy)<=REACH;
    ctx.fillStyle=inR?'rgba(255,255,255,.2)':'rgba(255,255,255,.08)';rr(ctx,ht.tx*T+2,ht.ty*T+2,T-4,T-4,12);ctx.fill();
    ctx.strokeStyle=inR?'rgba(255,255,255,.95)':'rgba(255,255,255,.5)';ctx.lineWidth=2.5;ctx.setLineDash(inR?[]:[6,5]);ctx.stroke();ctx.setLineDash([])}}

  D.push([HOUSE.base,()=>ctx.drawImage(houseSpr,HOUSE.x,HOUSE.y,HOUSE.w,HOUSE.h)]);
  D.push([VEND.base,()=>ctx.drawImage(vendSpr,VEND.x,VEND.y,VEND.w,VEND.h)]);
  for(const key in S.plots){const p=S.plots[key];if(!p.c)continue;const[tx,ty]=key.split(',').map(Number);if(tx<x0||tx>x1||ty<y0||ty>y1)continue;D.push([ty*T+36,()=>drawCrop(ctx,p.c,stageOf(p),tx*T+T/2,ty*T+T/2,gt,p.v||0)])}
  D.push([player.y,()=>{ctx.save();ctx.translate(player.x,player.y);drawChar(ctx,S.character,player.dir,player.phase,player.moving,gt,player.act);ctx.restore()}]);

    if(isMature(p)){const k=.6+.4*Math.sin(gt*4+tx);ctx.fillStyle=`rgba(255,226,110,${k})`;star(ctx,cx+14,cy-(p.c==='sunflower'?30:8),5+k*1.5);ctx.fill()}

  ctx.globalAlpha=1;
  ctx.font='bold 15px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.lineJoin='round';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.lineWidth=4;ctx.strokeStyle='rgba(140,100,70,.85)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle='#fff';ctx.fillText(f.txt,f.x,f.y)}
  ctx.globalAlpha=1;
  // 화면 효과
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(S.weather==='cloudy'){ctx.fillStyle='rgba(150,160,185,.08)';ctx.fillRect(0,0,view.w,view.h)}
  if(S.weather==='rain'){ctx.fillStyle='rgba(120,140,175,.12)';ctx.fillRect(0,0,view.w,view.h)}
  const tn=tint(S.time);if(tn){ctx.fillStyle=`rgba(${tn[0]},${tn[1]},${tn[2]},${tn[3]})`;ctx.fillRect(0,0,view.w,view.h)}
  const night=clamp((S.time/60-18.3)/2,0,1);
  if(night>0){ctx.setTransform(s,0,0,s,-cam.x*s,-cam.y*s);ctx.globalCompositeOperation='lighter';
    for(const[wx,wy,r]of[[HOUSE.x+75,HOUSE.y+147,44],[HOUSE.x+225,HOUSE.y+147,44],[HOUSE.x+150,HOUSE.y+62,28],[HOUSE.x+187,HOUSE.y+180,30]]){const g=ctx.createRadialGradient(wx,wy,0,wx,wy,r);g.addColorStop(0,`rgba(255,210,120,${.45*night})`);g.addColorStop(1,'rgba(255,210,120,0)');ctx.fillStyle=g;ctx.fillRect(wx-r,wy-r,r*2,r*2)}
    ctx.globalCompositeOperation='source-over';ctx.setTransform(dpr,0,0,dpr,0,0)}
  if(S.weather==='rain'&&!modalOpen){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.4;ctx.lineCap='round';ctx.beginPath();
    for(const d of drops){d.y+=.012*d.s;d.x-=.002*d.s;if(d.y>1.05){d.y=-.05;d.x=Math.random()*1.1}if(d.x<-.05)d.x=1.05;const x=d.x*view.w,y=d.y*view.h;ctx.moveTo(x,y);ctx.lineTo(x-3*d.s,y+12*d.s)}ctx.stroke()}
}

/* ================= 캐릭터 선택 ================= */
let selKind=null,selMode=false;
const cards=[...document.querySelectorAll('.ccard')];
cards.forEach(c=>c.addEventListener('click',()=>{selKind=c.dataset.kind;cards.forEach(x=>x.classList.toggle('on',x===c));$('#startBtn').disabled=false;unlockAudio();sfx('ui')}));
function drawPreviews(){
  for(const c of cards){const cv=c.querySelector('canvas'),g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
    const gr=g.createRadialGradient(150,300,10,150,300,140);gr.addColorStop(0,'rgba(195,234,158,.9)');gr.addColorStop(1,'rgba(195,234,158,0)');g.fillStyle=gr;g.fillRect(0,0,300,340);
    g.setTransform(4.2,0,0,4.2,150,300);const on=c.dataset.kind===selKind;drawChar(g,c.dataset.kind,'down',gt*12,on,gt,0)}
}
function showSelect(changing){
  selMode=!!changing;selKind=changing?S.character:null;
  cards.forEach(x=>x.classList.toggle('on',x.dataset.kind===selKind));
  $('#startBtn').disabled=!selKind;$('#startBtn').textContent=changing?'이 친구로 할래요':'농장으로 출발하기';
  $('#select').classList.remove('hidden');running=false;
  ['#hud','#toolbar','#actBtn','#joy'].forEach(s=>$(s).classList.add('hidden'));
}
$('#startBtn').addEventListener('click',()=>{
  if(!selKind)return;sfx('harvest');
  const isNew=!S.character;S.character=selKind;save();enterFarm();
  if(isNew&&!S.helpSeen)setTimeout(()=>openHelp(true),350);else if(selMode)toast('캐릭터를 바꿨어요!');
});
function enterFarm(){
  $('#select').classList.add('hidden');
  ['#hud','#toolbar','#actBtn','#joy'].forEach(s=>$(s).classList.remove('hidden'));
  player.x=S.player.x;player.y=S.player.y;player.dir=S.player.dir||'down';
  if(blocked(player.x,player.y)){player.x=SPAWN.x;player.y=SPAWN.y}
  lastHud='';updateHUD();running=true;
}

/* ================= 저장 타이머 & 루프 ================= */
setInterval(()=>{if(running&&(dirty||true))save()},6000);
setInterval(()=>{if(dirty)save()},1500);
addEventListener('pagehide',()=>{if(S.character)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.character)save()});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;gt+=dt;
  if(running)update(dt);
  render();
  if(!$('#select').classList.contains('hidden'))drawPreviews();
  requestAnimationFrame(loop)}

const saved=load();
if(saved&&saved.character){S=saved;enterFarm();setTimeout(()=>toast('다시 온 걸 환영해요! 🌷'),300)}
else{S=defaultState();showSelect(false)}
requestAnimationFrame(loop);
window.__farm={S,player,get state(){return S},useTool,nextDay,goInteract};
})();
</script>
